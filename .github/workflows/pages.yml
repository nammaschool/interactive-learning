name: Publish the play-along notebooks
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install jupyterlite-core jupyterlite-pyodide-kernel jupyter-server ipywidgets   # server: adds the notebooks; ipywidgets: the sliders
      - run: jupyter lite build --contents notebooks --output-dir dist
      - run: if [ -d cheatsheets ]; then cp -r cheatsheets dist/; fi   # the courses' cheat sheet PDFs, linked from descriptions
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
